name: Monorepo Deploy (Vercel)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (root)
        run: npm install

      - name: Install dependencies (backend)
        run: npm install
        working-directory: backend

      - name: Install dependencies (frontend)
        run: npm install
        working-directory: frontend

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install Cypress binary
        run: npx cypress install
        working-directory: frontend

      - name: Lint backend & frontend
        run: npm run lint

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/package-lock.json') }}

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators

      - name: Start Firebase Emulators
        run: npx firebase emulators:start --only firestore,auth --project demo-test --import=./emulator-data --export-on-exit=./emulator-data &
        working-directory: backend

      - name: Wait for Firestore Emulator
        run: npx wait-on tcp:8080

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Start backend server
        run: |
          cd backend
          npm run start &
        env:
          FIREBASE_CREDENTIALS: '{}'
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:8089
          FIREBASE_PROJECT_ID: demo-test

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:4000/api/health # or another health endpoint

      - name: Run backend tests
        run: PORT=4001 npm run test
        working-directory: backend
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:8089
          FIREBASE_PROJECT_ID: demo-test
          FIREBASE_CREDENTIALS: '{}'

      - name: Start frontend server
        run: |
          cd frontend
          npm run dev &
        env:
          VITE_FIREBASE_CONFIG: '{"apiKey":"test","authDomain":"test","projectId":"test"}'
          VITE_USE_FIREBASE_EMULATOR: 'true'
          NODE_NO_WARNINGS: 1
          TERM: xterm

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:5173

      - name: Run frontend unit tests
        run: npm run test:unit
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend
        env:
          VITE_FIREBASE_CONFIG: '{"apiKey":"test","authDomain":"test","projectId":"test"}'
          VITE_USE_FIREBASE_EMULATOR: 'true'
          NODE_NO_WARNINGS: 1
          TERM: xterm

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --cwd frontend

  deploy-backend:
    # Render deploy hook: only for pushes to main, only after CI passes.
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    env:
      BACKEND_URL: https://thefeud-backend.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the backend changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Deploy only when backend/ or render.yaml changed. If the previous
          # commit is unknown (new branch, force push), deploy to be safe.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Previous commit unknown; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -qE '^(backend/|render\.yaml$)'; then
            echo "Backend or render.yaml changed; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under backend/ or render.yaml; skipping Render deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy
        id: trigger
        if: steps.changes.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set; skipping Render deploy."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never echo the URL; it is a credential. -sS keeps errors but not the URL.
          curl --fail -sS -X POST -o /dev/null --max-time 30 "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Wait for backend health (best effort)
        if: steps.trigger.outputs.triggered == 'true'
        run: |
          # Free plan cold start is ~1 min. Render keeps the old instance serving
          # until the new one is healthy, so a 200 here does not prove the new
          # version is live; it confirms the service is up and warms it.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 -o /dev/null "$BACKEND_URL/api/health"; then
              echo "Backend healthy at $BACKEND_URL/api/health"
              exit 0
            fi
            echo "Attempt $i: not healthy yet; retrying in 10s"
            sleep 10
          done
          echo "::warning::Backend did not report healthy within 5 minutes. Check the Render dashboard."
